[project]
name = "uni-lag-project"
version = "1.0.0"
description = "Nigeria retail petrol prices 2007–2026: regime analysis, regional disparity and short-term forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "ruptures>=1.1.9",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "ipykernel>=6.0",
    "nbconvert>=7.0",
    "dash>=3.0",
    "dash-mantine-components>=2.0",
    "dash-ag-grid>=31.0",
    "dash-iconify>=0.1.2",
    "plotly>=5.24",
]
authors = [{ name = "Peters Moritus Azubuike" }]
keywords = ["fuel-prices", "nigeria", "time-series", "forecasting", "change-point-detection"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
